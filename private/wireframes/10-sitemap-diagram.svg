<text x="80" y="952" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="400" fill="#2a3742" text-anchor="start">•  Every page links to every other page through the header nav and the footer site map, so no page is more than one click from any other.</text>
<text x="80" y="972" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="400" fill="#2a3742" text-anchor="start">•  Services uses in-page anchors (#leak-detection etc.) rather than child pages, keeping the structure flat and the crawl depth shallow.</text>
<text x="80" y="992" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="400" fill="#2a3742" text-anchor="start">•  Home, Services and About each push traffic to booking.html, which is the single conversion point of the site.</text></svg>